name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASS: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Siapkan proyek Android
        run: ./prepare-android.sh
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
      - name: Build APK debug
        if: env.KEYSTORE_B64 == ''
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../RutePintar.apk
      - name: Build APK release (ditandatangani)
        if: env.KEYSTORE_B64 != ''
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          echo "$KEYSTORE_B64" | base64 -d > ../release.jks
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk ../aligned.apk
          "$BT/apksigner" sign --ks ../release.jks --ks-pass env:KEYSTORE_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out ../RutePintar.apk ../aligned.apk
          rm -f ../release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: RutePintar-apk
          path: RutePintar.apk
